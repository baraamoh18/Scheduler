<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supply Price Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600&display=swap">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
/* Layout: one working column; sticky header with tabs, then a toolbar and a dense, scannable table per tab. */
:root {
  --bg: #f4f6f4; --surface: #ffffff; --surface-2: #eef2ef; --ink: #18211d; --muted: #5b6862;
  --line: #d9e0dc; --accent: #0b6b5f; --accent-ink: #ffffff; --accent-weak: #dcefea;
  --best: #1d7438; --best-bg: #e2f2e5; --warn: #94570a; --warn-bg: #fbefdc; --danger: #a83232; --danger-bg: #f8e3e3;
  --f-display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111614; --surface: #19201d; --surface-2: #202825; --ink: #e4ebe7; --muted: #97a59e;
  --line: #2c3632; --accent: #52c0ad; --accent-ink: #0b1714; --accent-weak: #163631;
  --best: #74d08f; --best-bg: #17321f; --warn: #e6b062; --warn-bg: #352812; --danger: #f08b8b; --danger-bg: #3a1d1d;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111614; --surface: #19201d; --surface-2: #202825; --ink: #e4ebe7; --muted: #97a59e;
  --line: #2c3632; --accent: #52c0ad; --accent-ink: #0b1714; --accent-weak: #163631;
  --best: #74d08f; --best-bg: #17321f; --warn: #e6b062; --warn-bg: #352812; --danger: #f08b8b; --danger-bg: #3a1d1d;
  color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px 0; }
.brand { font-family: var(--f-display); font-weight: 600; font-size: 18px; letter-spacing: .01em; margin-right: auto; }
.brand small { font-family: var(--f-body); font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 8px; }
.sync { font-size: 12px; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; width: 100%; }
nav.tabs button { border: 0; background: none; color: var(--muted); font: 500 14px var(--f-body); padding: 10px 14px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .count { font-size: 11px; background: var(--surface-2); border-radius: 10px; padding: 1px 7px; margin-left: 6px; color: var(--muted); }
main.wrap { padding-block: 18px 60px; display: grid; gap: 16px; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 20px; margin: 0; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 500; font-size: 15px; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1 1 220px; min-width: 0; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; }
.stat b { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type="number"] { font-variant-numeric: tabular-nums; }
.btn { font: 500 13px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.btn.primary:hover { filter: brightness(1.07); }
button.btn.danger { color: var(--danger); }
button.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: var(--surface); }
button.btn.small { padding: 4px 9px; font-size: 12px; }
button:disabled { opacity: .5; cursor: not-allowed; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.tablebox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }
.ar { text-align: left; unicode-bidi: plaintext; }
input.ar { direction: rtl; text-align: right; }
.pname { min-width: 240px; max-width: 420px; }
.pname button { all: unset; cursor: pointer; font-weight: 500; display: block; width: 100%; text-align: left; unicode-bidi: plaintext; }
.pname button:hover { color: var(--accent); text-decoration: underline; }
.pname .det { font-size: 12px; color: var(--muted); text-align: left; unicode-bidi: plaintext; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { font-size: 11.5px; border-radius: 4px; padding: 2px 7px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.best { background: var(--best-bg); color: var(--best); font-weight: 600; }
.chip.cat { background: var(--accent-weak); color: var(--accent); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.lvl-high { background: var(--best-bg); color: var(--best); font-weight: 600; }
.chip.lvl-medium { background: var(--accent-weak); color: var(--accent); }
.chip.lvl-low { background: var(--warn-bg); color: var(--warn); }
.warn-text { color: var(--warn); }
.grid-cell { min-width: 150px; vertical-align: top; }
.grid-cell .offer { padding: 3px 0; }
.grid-cell .offer + .offer { border-top: 1px dashed var(--line); }
.grid-cell .offer button { all: unset; cursor: pointer; display: block; unicode-bidi: plaintext; font-size: 13px; }
.grid-cell .offer button:hover { color: var(--accent); text-decoration: underline; }
.grid-cell .offer.cheapest b { color: var(--best); }
th.size, td.size { position: sticky; left: 0; background: var(--surface-2); white-space: nowrap; font-weight: 600; }
.match-notes { grid-column: 1 / -1; display: flex; gap: 6px 16px; flex-wrap: wrap; }
td input.margin { width: 74px; text-align: right; }
td select.buy { max-width: 170px; }
.sell { font-weight: 600; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 10px; flex-wrap: wrap; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 500; }
.supplier { display: grid; gap: 8px; }
.supplier .name { font-family: var(--f-display); font-size: 17px; font-weight: 600; }
.note { background: var(--accent-weak); color: var(--ink); border-radius: 6px; padding: 10px 12px; font-size: 13px; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 6px; font-size: 13px; z-index: 30; max-width: calc(100% - 32px); }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0; width: min(760px, calc(100% - 24px)); max-height: calc(100% - 40px); }
dialog::backdrop { background: rgb(0 0 0 / .35); }
.dlg { display: grid; gap: 14px; padding: 18px; }
.dlg-head { display: flex; gap: 10px; align-items: flex-start; }
.dlg-head h3 { flex: 1; font-size: 17px; }
.match-row { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 10px; align-items: center; padding: 10px; border-bottom: 1px solid var(--line); }
.match-row:last-child { border-bottom: 0; }
.score { font-size: 12px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
@media (max-width: 640px) { .match-row { grid-template-columns: 1fr; } .score { text-align: left; } }
.qtotal td { font-weight: 600; background: var(--surface-2); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.gate { max-width: 520px; margin: 60px auto; }
.who { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">Supply Price Desk <small id="sub">Loading saved data…</small></div>
    <span class="sync" id="sync"></span>
    <span class="who" id="who" hidden><span id="who-email"></span><button class="btn small" id="signout">Sign out</button></span>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="products" aria-selected="true">Products</button>
      <button role="tab" data-tab="matching">Matching<span class="count" id="cnt-match">0</span></button>
      <button role="tab" data-tab="compare">Compare</button>
      <button role="tab" data-tab="ask" id="tab-ask" hidden>Ask Claude</button>
      <button role="tab" data-tab="suppliers">Suppliers<span class="count" id="cnt-sup">0</span></button>
      <button role="tab" data-tab="quote">Customer quote<span class="count" id="cnt-quote">0</span></button>
      <button role="tab" data-tab="settings">Settings</button>
    </nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
// ---------- state ----------
// window.SPD_AI (claude-ai.js) adds Claude's help on the claude.ai copy of this page; the website runs without it.
const AI = () => window.SPD_AI || null;
const S = {
  db: null, ready: false, gated: false,
  suppliers: {}, chunks: {}, links: {}, dismissed: {}, packs: {}, prodOv: {}, settings: null, quotes: {},
  tab: 'products', q: '', filter: 'all', mq: '', mlevel: 'likely', mshow: 80, cq: '', cmulti: false, cat: '', sort: 'name', page: 0,
  quote: loadDraft(), importState: null,
};
const DEFAULTS = { defaultMargin: 0.2, mode: 'markup', round: 0, currency: 'ج.م', company: '', catMargins: {}, fields: {}, perPiece: true };
// columns people add themselves while uploading (e.g. تجاري, صيدلي): settings.fields = {id: {name, order}}
const userFields = () => Object.entries(settings().fields || {}).map(([id, f]) => ({ id, ...f })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
function saveField(id, patch) {
  const fields = { ...settings().fields, [id]: { ...(settings().fields || {})[id], ...patch } };
  S.settings = { ...settings(), fields }; setDoc('settings/main', { fields: { [id]: patch } }, MERGE); changed();
}
function deleteField(id) {
  const fields = { ...settings().fields }; delete fields[id];
  S.settings = { ...settings(), fields }; setDoc('settings/main', { fields: { [id]: DEL() } }, MERGE); changed();
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (n == null || isNaN(n)) ? '–' : Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: n && Math.abs(n) < 1 ? 4 : 2 });
const pct = m => (m == null || isNaN(m)) ? '' : +(m * 100).toFixed(2);
const settings = () => Object.assign({}, DEFAULTS, S.settings || {});
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
function loadDraft() {
  try { return JSON.parse(localStorage.getItem('quoteDraft')) || newQuote(); } catch { return newQuote(); }
}
function saveDraft() { try { localStorage.setItem('quoteDraft', JSON.stringify(S.quote)); } catch {} }
function newQuote() { return { id: null, customer: '', date: new Date().toISOString().slice(0, 10), notes: '', lines: [] }; }

// ---------- text helpers ----------
const AR_DIG = '٠١٢٣٤٥٦٧٨٩';
function norm(s) {
  return String(s || '').replace(/[٠-٩]/g, d => AR_DIG.indexOf(d)).replace(/٫/g, '.')
    .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ـ/g, '')
    .replace(/([؀-ۿ])\1{2,}/g, '$1').toLowerCase().replace(/[()\[\]{}"'،,]/g, ' ').replace(/\s+/g, ' ').trim();
}
// true when every word of the query appears somewhere in the text, in any order
// a number in the query matches whole numbers only, so 10 finds "10 سم" but not 100
function matches(text, q) {
  const t = norm(text);
  return norm(q).split(' ').every(w => !w || (/^\d+(\.\d+)?$/.test(w) ? new RegExp('(^|[^\\d.])' + w.replace('.', '\\.') + '(?![\\d]|\\.\\d)').test(t)
    : t.includes(w) || (w.length > 3 && w.startsWith('ال') && t.includes(w.slice(2)))));
}
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }

// ---------- derived data ----------
let D = { offers: [], products: [], byPid: {}, cats: [], fields: [] };
function supplierOrder() { return Object.values(S.suppliers).sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || a.name.localeCompare(b.name)); }
// An item's identity within a supplier list: its name and details, plus a counter for exact repeats.
function offerKey(name, detail, seen) {
  const base = hash(norm(name) + '|' + norm(detail));
  return base + '.' + (seen[base] = (seen[base] || 0) + 1);
}
function derive() {
  const st = settings();
  const offers = [];
  for (const sup of supplierOrder()) {
    const seen = {};
    for (let c = 0; c < (sup.chunks || 0); c++) {
      const ch = S.chunks[sup.id + '-' + c];
      if (!ch) continue;
      ch.forEach((r, i) => {
        const [name, price, detail, source, category, prev, extra] = r;
        const key = sup.id + ':' + offerKey(name, detail, seen);
        const own = 'o-' + sup.id + '-' + key.slice(sup.id.length + 1).replace('.', '-');
        const x = extra || {}, set = S.packs[key] || {};
        const pack = set.pack || +x.pack || 1, disc = set.disc ?? (x.disc != null && x.disc !== '' ? +x.disc : discountIn(detail)) ?? 0;
        // net: what one piece really costs after the supplier's discount; prices are compared on this
        const net = st.perPiece ? +price * (1 - disc / 100) / pack : +price;
        offers.push({ key, sid: sup.id, sup: sup.name, name, price: +price, pack, disc, net, prev: +prev || 0, extra: x, detail: detail || '', source: source || '', category: category || '', pid: S.links[key] || own });
      });
    }
  }
  const byPid = {};
  for (const o of offers) (byPid[o.pid] ||= { pid: o.pid, offers: [] }).offers.push(o);
  const cats = new Set(), fieldList = userFields(), fieldsUsed = new Set();
  for (const p of Object.values(byPid)) {
    const ov = S.prodOv[p.pid] || {};
    const first = p.offers[0];
    p.name = ov.name || first.name;
    p.detail = ov.detail ?? first.detail;
    p.category = ov.category ?? (p.offers.find(o => o.category)?.category || '');
    if (p.category) cats.add(p.category);
    const priced = p.offers.filter(o => o.price > 0); // a 0 or missing price is never the cheapest
    const sorted = [...(priced.length ? priced : p.offers)].sort((a, b) => a.net - b.net);
    p.best = sorted[0]; p.high = sorted[sorted.length - 1];
    p.nSup = new Set(p.offers.map(o => o.sid)).size;
    p.chosenSid = ov.chosen || '';
    const chosen = p.chosenSid ? sorted.find(o => o.sid === p.chosenSid) : null;
    p.buy = chosen || p.best;
    p.cost = p.buy.net;
    // extra columns come from the supplier you buy from, else from any supplier that has them
    const extra = k => { const v = p.buy.extra[k] ?? p.offers.find(o => o.extra[k] != null && o.extra[k] !== '')?.extra[k]; return v == null ? '' : v; };
    p.unit = ov.unit || (st.perPiece && p.buy.pack > 1 ? 'قطعة' : String(extra('unit')));
    p.extra = {}; for (const f of fieldList) { const v = extra(f.id); if (v !== '') { p.extra[f.id] = v; fieldsUsed.add(f.id); } }
    p.marginOv = ov.margin;
    p.margin = ov.margin ?? st.catMargins[p.category] ?? st.defaultMargin;
    p.sell = sellPrice(p.cost, p.margin, st);
    p.profit = p.sell - p.cost;
  }
  D = { offers, byPid, products: Object.values(byPid), cats: [...cats].sort(), fields: fieldList.filter(f => fieldsUsed.has(f.id)) };
}
// a discount given as a detail column, like "خصم: 28" or "Discount %: 10"
function discountIn(detail) {
  for (const part of String(detail || '').split(' · ')) {
    const m = part.match(/^\s*(?:نسب[ةه] )?(?:ال)?خصم[^:]*:|^\s*discount[^:]*:/i);
    if (m) { const n = TableReader.parsePrice(part.slice(m[0].length)); if (n >= 0 && n < 100) return n; }
  }
  return null;
}
// "28% off, 10 per pack: 7.20 a piece"
function netText(o) {
  if (o.net === o.price) return '';
  return [o.disc ? `${+o.disc}% off` : '', o.pack > 1 ? `${o.pack} per pack` : ''].filter(Boolean).join(', ') + `: ${fmt(o.net)} a piece`;
}
// with margin on the sale price, 100% or more has no sell price
function marginOk(n) {
  if (settings().mode !== 'margin' || isNaN(n) || n < 100) return true;
  toast('With the margin taken from the sale price, a margin must be under 100%.'); return false;
}
function sellPrice(cost, m, st) {
  let s = st.mode === 'margin' ? (m < 1 ? cost / (1 - m) : NaN) : cost * (1 + m);
  if (st.round > 0) s = Math.ceil(s / st.round - 1e-9) * st.round;
  return Math.round(s * 100) / 100;
}

// ---------- matching suggestions ----------
// Matcher (matcher.js) compares item names: words, sizes and pack words. Details such as a discount
// column are left out, and a pair whose sizes differ is never suggested.
// Matching a big list takes about half a second, so it only runs again when the lists, links or
// dismissed pairs change, not after a margin or quote edit.
let suggestCache = null, suggestRaw = null, suggestSig = '';
function suggestions() {
  if (suggestCache) return suggestCache;
  const sig = Object.keys(S.dismissed).join(',') + '#' + D.products.map(p => p.pid + ':' + p.offers.map(o => o.key).join(',') + ':' + p.best.net).join('|');
  if (sig !== suggestSig) {
    const items = D.products.map(p => ({ pid: p.pid, name: p.offers[0].name, detail: p.offers[0].detail, sids: new Set(p.offers.map(o => o.sid)), price: p.best.net }));
    suggestRaw = Matcher.suggest(items, { dismissed: S.dismissed }); suggestSig = sig;
  }
  return (suggestCache = suggestRaw.map(s => ({ ...s, a: D.byPid[s.a.pid], b: D.byPid[s.b.pid] })));
}
const likely = list => list.filter(s => s.level !== 'low');
const LEVEL_TEXT = { high: 'Very likely', medium: 'Possible', low: 'Weak' };
const levelChip = l => `<span class="chip lvl-${l}">${LEVEL_TEXT[l]}</span>`;

// ---------- db ----------
const queues = {};
function write(path, fn) {
  const run = (queues[path] || Promise.resolve()).then(fn).catch(e => {
    console.error(e);
    toast(e?.friendly || (e && e.code === 'resource-exhausted' ? 'The free daily limit was reached. Try again tomorrow, or delete an old supplier list.' : 'Could not save that change. Check your connection and try again.'));
  });
  queues[path] = run; return run;
}
async function setDoc(path, data, opts) { if (!S.db) { toast('Sign in to save changes.'); return; } return write(path, () => S.db.doc(path).set(data, opts || {})); }
async function delDoc(path) { if (S.db) return write(path, () => S.db.doc(path).delete()); }
// Shared docs are saved field by field (merge), so two people editing at once don't erase each other's changes.
const MERGE = { merge: true };
const DEL = () => firebase.firestore.FieldValue.delete();
function saveLinks(keys) { return setDoc('matching/links', { map: Object.fromEntries(keys.map(k => [k, S.links[k]])) }, MERGE); }
function saveDismissed(pk) { return setDoc('matching/dismissed', { map: { [pk]: true } }, MERGE); }
// an item's pieces per pack and discount set by hand: matching/packs = {map: {offer key: {pack, disc}}}
function savePack(key) { return setDoc('matching/packs', { map: { [key]: S.packs[key] ?? DEL() } }, MERGE); }
// fields: the product fields that changed; a field missing from S.prodOv[pid] is removed
function saveOv(pid, fields) {
  const ov = S.prodOv[pid] || {};
  return setDoc('products/' + pid, Object.fromEntries(fields.map(f => [f, ov[f] ?? DEL()])), MERGE);
}

let renderPending = false;
function changed() {
  suggestCache = null; derive();
  const pi = S.pendingImport; // once a fresh import has arrived, show what can be matched
  if (pi && S.suppliers[pi.sid]?.chunks === pi.chunks && [...Array(pi.chunks).keys()].every(c => S.chunks[pi.sid + '-' + c])) {
    S.pendingImport = null; S.tab = likely(suggestions()).length ? 'matching' : 'products';
  }
  scheduleRender();
}
function scheduleRender() { if (renderPending) return; renderPending = true; requestAnimationFrame(() => { renderPending = false; render(); }); }

// Firestore can't hold arrays inside arrays, so each row is stored as {n, p, d, s, c}.
// o (optional) is the item's price before the latest upload, when that upload changed it.
// x (optional) holds extra columns: the unit and the user's own columns, {unit, <field id>: value}.
const rowsToDb = rows => rows.map(([n, p, d, s, c, o, x]) => Object.assign({ n: n ?? '', p: +p, d: d ?? '', s: s ?? '', c: c ?? '' }, o > 0 ? { o: +o } : {}, x && Object.keys(x).length ? { x } : {}));
const rowsFromDb = rows => (rows || []).map(r => Array.isArray(r) ? r : [r.n, r.p, r.d, r.s, r.c, r.o, r.x]);
const configured = () => { const c = window.FIREBASE_CONFIG; return c && c.apiKey && !/PASTE/i.test(c.apiKey); };
let unsubs = [];

function gate(html) { S.ready = false; S.gated = true; $('#view').innerHTML = `<div class="panel gate">${html}</div>`; }
function showSignIn(msg) {
  gate(`<h2>Sign in to Supply Price Desk</h2>
    <p class="muted">${msg || 'Use the Google account your team added to the list. Prices and quotes are shared between everyone on the team.'}</p>
    <div><button class="btn primary" id="signin">Sign in with Google</button></div>`);
  $('#signin').onclick = async () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    if (firebase.auth().currentUser) await firebase.auth().signOut();
    firebase.auth().signInWithPopup(provider).catch(e => {
      if (e?.code === 'auth/popup-blocked' || e?.code === 'auth/operation-not-supported-in-this-environment') return firebase.auth().signInWithRedirect(provider);
      if (e?.code !== 'auth/popup-closed-by-user' && e?.code !== 'auth/cancelled-popup-request') toast(e?.code === 'auth/unauthorized-domain' ? 'This web address is not allowed yet. Add it under Authentication > Settings > Authorized domains in Firebase.' : 'Sign-in did not work. Try again.');
    });
  };
}

async function boot() {
  render();
  if (typeof firebase === 'undefined') { gate(`<h2>Could not load</h2><p class="muted">The sign-in service did not load. Check your connection and reload the page.</p>`); return; }
  if (!configured()) { gate(`<h2>Almost ready</h2><p class="muted">This copy of Supply Price Desk is not connected to a Firebase project yet. Paste your project's web app settings into <b>firebase-config.js</b>, as described in SETUP.md, then reload.</p>`); return; }
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const db = firebase.firestore();
  try { await db.enablePersistence({ synchronizeTabs: true }); } catch (e) { /* another tab or a private window; works online only */ }
  $('#signout').onclick = () => firebase.auth().signOut();
  firebase.auth().onAuthStateChanged(user => {
    unsubs.forEach(u => u()); unsubs = []; S.db = null;
    $('#who').hidden = !user; $('#who-email').textContent = user?.email || '';
    if (!user) { $('#sub').textContent = ''; showSignIn(); return; }
    S.ready = false; S.gated = false; render();
    listen(db);
  });
}

function listen(db) {
  S.db = db;
  const err = e => {
    console.error(e);
    unsubs.forEach(u => u()); unsubs = [];
    if (e?.code === 'permission-denied') {
      S.db = null;
      showSignIn(`<b>${esc(firebase.auth().currentUser?.email)}</b> is not on this team's list. Ask the person who set up the site to add your email, or sign out and use another account.`);
      $('#signin').textContent = 'Use another Google account';
    } else $('#sync').textContent = 'Live updates paused. Reload to reconnect.';
  };
  let pending = 6; const loaded = () => { if (--pending === 0) { S.ready = true; changed(); } };
  const once = f => { let done = false; return (...a) => { f(...a); if (!done) { done = true; loaded(); } else changed(); }; };
  unsubs.push(
    db.collection('suppliers').onSnapshot(once(s => { S.suppliers = {}; s.docs.forEach(d => S.suppliers[d.id] = { id: d.id, ...d.data() }); }), err),
    db.collection('items').onSnapshot(once(s => { S.chunks = {}; s.docs.forEach(d => S.chunks[d.id] = rowsFromDb(d.data().rows)); }), err),
    db.collection('products').onSnapshot(once(s => { S.prodOv = {}; s.docs.forEach(d => S.prodOv[d.id] = { ...d.data() }); }), err),
    db.collection('quotes').onSnapshot(once(s => { S.quotes = {}; s.docs.forEach(d => S.quotes[d.id] = { id: d.id, ...d.data() }); }), err),
    db.collection('matching').onSnapshot(once(s => {
      S.links = {}; S.dismissed = {}; S.packs = {};
      s.docs.forEach(d => { if (['links', 'dismissed', 'packs'].includes(d.id)) S[d.id] = { ...(d.data().map || {}) }; });
    }), err),
    db.doc('settings/main').onSnapshot(once(d => { S.settings = d.exists ? d.data() : null; }), err),
  );
}

// ---------- render ----------
function render() {
  if (S.gated) return;
  $('#tab-ask').hidden = !AI();
  if (S.tab === 'ask' && !AI()) S.tab = 'products';
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab));
  $('#cnt-sup').textContent = Object.keys(S.suppliers).length;
  $('#cnt-quote').textContent = S.quote.lines.length;
  $('#cnt-match').textContent = S.ready && D.products.length ? likely(suggestions()).length : 0;
  if (S.ready) $('#sub').textContent = `${D.products.length.toLocaleString()} products from ${Object.keys(S.suppliers).length} suppliers`;
  const v = $('#view');
  if (!S.ready) { v.innerHTML = `<div class="panel"><h2>Loading your price lists…</h2><p class="muted">Products, suppliers and quotes appear here once your saved data arrives.</p></div>`; return; }
  ({ products: renderProducts, matching: renderMatching, compare: renderCompare, suppliers: renderSuppliers, quote: renderQuote, settings: renderSettings, ask: v2 => AI().renderAsk(v2) })[S.tab](v);
}

function filtered() {
  const q = S.q.trim();
  let list = D.products.filter(p => {
    if (S.filter === 'multi' && p.nSup < 2) return false;
    if (S.filter === 'changed' && !p.offers.some(o => o.prev > 0 && o.prev !== o.price)) return false;
    if (S.filter.startsWith('sup:') && !p.offers.some(o => o.sid === S.filter.slice(4))) return false;
    if (S.cat && p.category !== S.cat) return false;
    return !q || matches(p.name + ' ' + p.detail + ' ' + p.category, q);
  });
  const by = { name: (a, b) => a.name.localeCompare(b.name, 'ar'), best: (a, b) => a.best.net - b.best.net, bestd: (a, b) => b.best.net - a.best.net, offers: (a, b) => b.nSup - a.nSup || a.name.localeCompare(b.name, 'ar'), saving: (a, b) => (b.high.net - b.best.net) - (a.high.net - a.best.net) }[S.sort];
  return list.sort(by);
}

function trend(o) {
  if (!(o.prev > 0) || o.prev === o.price) return '';
  const up = o.price > o.prev, ch = Math.abs(o.price / o.prev - 1) * 100;
  return ` <span title="was ${fmt(o.prev)} before the last upload" style="color:var(${up ? '--danger' : '--best'})">${up ? '▲' : '▼'}${ch < 9.95 ? +ch.toFixed(1) : Math.round(ch)}%</span>`;
}
function rowHtml(p) {
  const st = settings();
  const prices = [...p.offers].sort((a, b) => a.net - b.net).map(o => `<span class="chip ${p.nSup > 1 && o === p.best ? 'best' : ''}" title="${esc(netText(o))}">${esc(o.sup)} ${fmt(o.price)}${o.net !== o.price ? ` → ${fmt(o.net)}` : ''}${trend(o)}</span>`).join('');
  const supIds = [...new Set(p.offers.map(o => o.sid))];
  const buy = p.nSup > 1
    ? `<select class="buy" data-pid="${esc(p.pid)}" aria-label="Buy from"><option value="">Cheapest (${esc(p.best.sup)})</option>${supIds.map(id => `<option value="${esc(id)}" ${p.chosenSid === id ? 'selected' : ''}>${esc(S.suppliers[id]?.name || id)}</option>`).join('')}</select>`
    : `<span class="muted">${esc(p.best.sup)}</span>`;
  const inQ = S.quote.lines.some(l => l.pid === p.pid);
  return `<tr>
    <td class="pname"><button data-open="${esc(p.pid)}">${esc(p.name)}</button>${p.detail || p.unit ? `<div class="det">${esc([p.detail, p.unit].filter(Boolean).join(' · '))}</div>` : ''}${p.category ? `<div class="chips" style="margin-top:3px"><span class="chip cat">${esc(p.category)}</span></div>` : ''}</td>
    ${D.fields.map(f => `<td class="ar">${esc(p.extra[f.id] ?? '')}</td>`).join('')}
    <td><div class="chips">${prices}</div></td>
    <td>${buy}</td>
    <td class="num">${fmt(p.cost)}</td>
    <td class="num"><input class="margin" type="number" step="0.5" data-pid="${esc(p.pid)}" value="${p.marginOv == null ? '' : pct(p.marginOv)}" placeholder="${pct(p.margin)}" aria-label="Margin percent"></td>
    <td class="num sell">${fmt(p.sell)}</td>
    <td class="num">${fmt(p.profit)}</td>
    <td><button class="btn small" data-addq="${esc(p.pid)}" ${inQ ? 'disabled' : ''}>${inQ ? 'In quote' : 'Add to quote'}</button></td>
  </tr>`;
}

// an offer's unit and the user's own columns, as "الوحدة: علبة · تجاري: 5.2"
function extraText(o) {
  const parts = [];
  if (o.extra.unit) parts.push('Unit: ' + o.extra.unit);
  if (netText(o)) parts.push(netText(o));
  for (const f of userFields()) if (o.extra[f.id] != null && o.extra[f.id] !== '') parts.push(f.name + ': ' + o.extra[f.id]);
  return parts.join(' · ');
}

    </div></div>
    <div class="tablebox">${shown.length ? shown.map(s => `<div class="match-row">

async function readImport(file) {

    const wb = /\.csv$/i.test(file.name) ? XLSX.read(await csvText(file), { type: 'string', raw: true }) : XLSX.read(await file.arrayBuffer(), { type: 'array' });

    if (!raw.length) { toast('That file has no rows.'); return; }
    const width = Math.max(...raw.map(r => r.length));

    const txtScore = c => sample.reduce((s, r) => s + (TableReader.isNumber(String(r[c])) ? 0 : String(r[c]).length), 0);
    const cols = [...Array(width).keys()];

    const byHead = re => cols.find(c => re.test(heads[c]) && !TableReader.isNumber(heads[c]));
    const priceHead = byHead(/(السعر|سعر|الثمن|price|cost)/i);
    const price = priceHead ?? cols.reduce((a, b) => numScore(b) > numScore(a) ? b : a, 0);
    const nameHead = byHead(/(اسم|الصنف|المنتج|البيان|الوصف|product|item|name|description)/i);
    const name = nameHead != null && nameHead !== price ? nameHead : cols.filter(c => c !== price).reduce((a, b) => txtScore(b) > txtScore(a) ? b : a, cols.find(c => c !== price) ?? 0);

}

// ---------- column choices for Excel/CSV ----------

const USES = [['name', 'Item name'], ['price', 'Price'], ['detail', 'Details'], ['category', 'Category'], ['unit', 'Unit'], ['pack', 'Pieces per pack'], ['disc', 'Discount %'], ['skip', "Don't import"]];

  I.cols[c].use = use; delete I.cols[c].rank;

// A first guess for the other columns, from their headers: a second price becomes its own column,

function guessColumn(head, numeric, newFields) {

  if (/^(ال)?وحده$|^unit$|وحده|pieces|pcs|per pack/.test(h)) return { use: numeric ? 'pack' : 'unit', label: '' };
  if (/سعر|price|تجاري|صيدلي|جمهور|جمله|قطاعي/.test(h) && numeric) {

// reuse the columns chosen the last time this supplier's list was uploaded, matched by header text
function applySavedColumns(I) {

  if (!saved?.length) return;
  const header = S.suppliers[I.sid].header !== false;
  const heads = I.rows[0].map(h => String(h ?? '').trim());
  const found = saved.map((sc, i) => { const c = header && sc.header ? heads.indexOf(sc.header) : sc.col ?? i; return c < I.width ? c : -1; });
  if (!found.some((c, i) => c >= 0 && saved[i].use === 'name') || !found.some((c, i) => c >= 0 && saved[i].use === 'price')) return;

  const details = I.cols.map((x, c) => x.use === 'detail' ? c : -1).filter(c => c >= 0).sort((a, b) => (I.cols[a].rank ?? 1000 + a) - (I.cols[b].rank ?? 1000 + b));

function priceReport(sid, rows) {

function arm(btn, text) {

}
async function deleteSupplier(sid, btn) {

  const left = new Set(D.offers.filter(o => o.sid !== sid).map(o => o.pid));

  for (let r = startRow; r <= range.e.r; r++) for (const c of moneyCols) { const cell = ws[XLSX.utils.encode_cell({ r, c })]; if (cell && cell.t === 'n') cell.z = '#,##0.00'; }

    widths = [6, 55, 20, 28, 10, 16]; money = [5];
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet(aoa, widths, money, 1), internal ? 'Costing' : 'Price list');
  await saveXlsx(wb, `${internal ? 'Costing sheet' : 'Price list'} ${fileDate()}.xlsx`);
}

// ---------- settings ----------
function renderSettings(v) {
  const st = settings();
  v.innerHTML = `<div class="panel"><h2>Pricing rules</h2>
    <div class="grid2">
      <div class="field"><label for="st-m">Default margin %</label><input id="st-m" type="number" step="0.5" value="${pct(st.defaultMargin)}"></div>
      <div class="field"><label for="st-mode">How the margin is applied</label><select id="st-mode">
        <option value="markup" ${st.mode === 'markup' ? 'selected' : ''}>Added on cost: 100 at 20% sells for 120</option>
        <option value="margin" ${st.mode === 'margin' ? 'selected' : ''}>Share of sale price: 100 at 20% sells for 125</option></select></div>
      <div class="field"><label for="st-piece">Compare suppliers on</label><select id="st-piece">
        <option value="1" ${st.perPiece ? 'selected' : ''}>Price per piece after discount</option>
        <option value="0" ${st.perPiece ? '' : 'selected'}>Price as listed</option></select></div>
      <div class="field"><label for="st-round">Round sell prices up to</label><select id="st-round">
        ${[[0, 'No rounding'], [0.05, '0.05'], [0.25, '0.25'], [0.5, '0.50'], [1, '1'], [5, '5']].map(([v, l]) => `<option value="${v}" ${st.round == v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label for="st-cur">Currency label</label><input id="st-cur" value="${esc(st.currency)}"></div>
      <div class="field"><label for="st-co">Your company name (top of customer files)</label><input id="st-co" value="${esc(st.company)}" placeholder="Shown on quotes and price lists"></div>
    </div>
    <p class="small muted">A margin set on a product wins over its category's margin, which wins over the default.</p></div>
  <div class="panel"><h2>Margin by category</h2>
    ${D.cats.length ? `<div class="tablebox"><table><thead><tr><th>Category</th><th class="num">Products</th><th class="num">Margin %</th></tr></thead><tbody>${D.cats.map((c, i) => `<tr><td class="ar">${esc(c)}</td><td class="num">${D.products.filter(p => p.category === c).length}</td><td class="num"><input type="number" step="0.5" style="width:90px;text-align:right" data-catm="${i}" value="${st.catMargins[c] == null ? '' : pct(st.catMargins[c])}" placeholder="${pct(st.defaultMargin)}" aria-label="Category margin"></td></tr>`).join('')}</tbody></table></div>`
      : '<p class="muted">No categories yet. Set a category on any product and it appears here.</p>'}
  </div>
  <div class="panel"><h2>Your columns</h2>
    ${userFields().length ? `<p class="small muted">Columns you added while uploading. Renaming changes the name everywhere; removing hides the column (the uploaded values stay, so adding a column with the same name brings them back).</p>
    <div class="tablebox"><table><thead><tr><th>Name</th><th class="num">Products with a value</th><th></th></tr></thead><tbody>${userFields().map(f => `<tr><td><input class="ar" data-fren="${esc(f.id)}" value="${esc(f.name)}" aria-label="Column name"></td><td class="num">${D.products.filter(p => p.extra[f.id] != null).length.toLocaleString()}</td><td><button class="btn small danger" data-fdel="${esc(f.id)}">Remove</button></td></tr>`).join('')}</tbody></table></div>`
      : '<p class="muted">None yet. When you upload a list, choose <b>+ New column</b> for any column you want to keep under its own name.</p>'}
  </div>
  <div class="panel"><h2>Backup</h2>
    <p class="muted">Download everything (supplier lists, matches, product edits, settings and saved quotes) as one file, or load a backup file. Loading adds the backup's data and replaces anything with the same name; nothing else is deleted.</p>
    <div class="row"><button class="btn" id="bk-get">Download backup</button>
      <label class="btn" style="display:inline-block">Load a backup file<input id="bk-put" type="file" accept=".json,application/json" hidden></label>
      <span class="muted small" id="bk-status"></span></div>
  </div>`;
  $('#bk-get').onclick = downloadBackup;
  document.querySelectorAll('[data-fren]').forEach(inp => inp.onchange = () => { const n = inp.value.trim(); if (n) saveField(inp.dataset.fren, { name: n }); else render(); });
  document.querySelectorAll('[data-fdel]').forEach(btn => btn.onclick = () => {
    if (!arm(btn, 'Click again')) return;
    deleteField(btn.dataset.fdel); toast('Column removed');
  });
  $('#bk-put').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) restoreBackup(f); };
  const save = (patch, dbPatch = patch) => { S.settings = { ...settings(), ...patch }; setDoc('settings/main', dbPatch, MERGE); changed(); };
  $('#st-m').onchange = e => { const n = parseFloat(e.target.value); if (!isNaN(n) && marginOk(n)) save({ defaultMargin: n / 100 }); else render(); };
  $('#st-mode').onchange = e => {
    const cur = settings(); // not st: a change just before this may not have redrawn the page yet
    const all = [cur.defaultMargin, ...Object.values(cur.catMargins), ...Object.values(S.prodOv).map(o => o.margin).filter(m => m != null)];
    if (e.target.value === 'margin' && all.some(m => m >= 1)) { toast('Some margins are 100% or more, which has no price when taken from the sale price. Lower them first.'); render(); return; }
    save({ mode: e.target.value });
  };
  $('#st-round').onchange = e => save({ round: +e.target.value });
  $('#st-piece').onchange = e => save({ perPiece: e.target.value === '1' });
  $('#st-cur').onchange = e => save({ currency: e.target.value.trim() || 'ج.م' });
  $('#st-co').onchange = e => save({ company: e.target.value.trim() });
  document.querySelectorAll('[data-catm]').forEach(inp => inp.onchange = () => {
    const c = D.cats[+inp.dataset.catm], cm = { ...settings().catMargins }, n = parseFloat(inp.value);
    if (!marginOk(n)) { render(); return; }
    if (isNaN(n)) delete cm[c]; else cm[c] = n / 100;
    save({ catMargins: cm }, { catMargins: { [c]: isNaN(n) ? DEL() : n / 100 } });
  });
}

// ---------- backup ----------
function downloadBackup() {
  const docs = {};
  for (const sup of Object.values(S.suppliers)) { const { id, ...d } = sup; docs['suppliers/' + id] = d; }
  for (const [id, rows] of Object.entries(S.chunks)) docs['items/' + id] = { rows };
  docs['matching/links'] = { map: S.links }; docs['matching/dismissed'] = { map: S.dismissed }; docs['matching/packs'] = { map: S.packs };
  for (const [pid, ov] of Object.entries(S.prodOv)) docs['products/' + pid] = ov;
  if (S.settings) docs['settings/main'] = S.settings;
  for (const q of Object.values(S.quotes)) { const { id, ...d } = q; docs['quotes/' + id] = d; }
  const blob = new Blob([JSON.stringify({ app: 'supply-price-desk', version: 1, exported: new Date().toISOString(), docs })], { type: 'application/json' });
  if (window.SPD_SAVE_FILE) return window.SPD_SAVE_FILE(`Supply Price Desk backup ${fileDate()}.json`, blob).then(() => toast('Backup downloaded'), e => { console.error(e); toast('The backup was not saved.'); });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Supply Price Desk backup ${fileDate()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function restoreBackup(file) {
  if (!S.db) { toast('Sign in to load a backup.'); return; }
  let data;
  try { data = JSON.parse(await file.text()); } catch { data = null; }
  if (!data || data.app !== 'supply-price-desk' || !data.docs) { toast('That file is not a Supply Price Desk backup.'); return; }
  const allowed = /^(suppliers|items|matching|products|settings|quotes)\/[^/]+$/;
  const entries = Object.entries(data.docs).filter(([path]) => allowed.test(path));
  const status = $('#bk-status');
  try {
    for (let i = 0; i < entries.length; i += 100) {
      const batch = S.db.batch();
      for (const [path, d] of entries.slice(i, i + 100)) {
        if (path.startsWith('matching/')) {
          // keep matches people made here and add the backup's on top
          batch.set(S.db.doc(path), { map: d.map || {} }, MERGE);
        } else batch.set(S.db.doc(path), path.startsWith('items/') ? { ...d, rows: rowsToDb(rowsFromDb(d.rows)) } : d);
      }
      if (status) status.textContent = `Loading… ${Math.min(i + 100, entries.length)} of ${entries.length}`;
      await batch.commit();
    }
    toast('Backup loaded'); if (status) status.textContent = '';
  } catch (e) { console.error(e); toast(e?.friendly || (e?.code === 'resource-exhausted' ? 'The free daily limit was reached. Try again tomorrow.' : 'Loading stopped partway. Try again.')); }
}

// ---------- events ----------
$('#tabs').onclick = e => { const b = e.target.closest('button[data-tab]'); if (b) { S.tab = b.dataset.tab; render(); } };
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.go) { S.tab = d.go; render(); }
  else if (d.open) openProduct(d.open);
  else if (d.addq) addToQuote(d.addq);
  else if (d.merge) { merge(d.merge, d.into); const dlg = $('#dlg'); if (dlg.open) { dlg.close(); openProduct(d.into); } }
  else if (d.split) { split(d.split); $('#dlg').close(); }
  else if (d.dismiss) { S.dismissed[d.dismiss] = true; saveDismissed(d.dismiss); changed(); }
  else if (d.delSup) deleteSupplier(d.delSup, t);
  else if (d.updateSup) { S.importState = { sid: d.updateSup }; render(); $('#import').scrollIntoView({ behavior: 'smooth' }); }
  else if (d.rmq) { S.quote.lines.splice(+d.rmq, 1); saveDraft(); render(); }
  else if (d.loadq) { const q = S.quotes[d.loadq]; S.quote = { id: q.id, customer: q.customer, date: q.date, notes: q.notes || '', lines: q.lines.map(l => ({ ...l, manual: l.manual ?? l.price != null })) }; saveDraft(); render(); }
  else if (d.delq) {
    if (!arm(t, 'Click again')) return;
    delDoc('quotes/' + d.delq); if (S.quote.id === d.delq) S.quote.id = null; toast('Quote deleted');
  }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.pid && t.classList.contains('buy')) { const ov = { ...(S.prodOv[d.pid] || {}) }; if (t.value) ov.chosen = t.value; else delete ov.chosen; S.prodOv[d.pid] = ov; saveOv(d.pid, ['chosen']); changed(); }
  else if (d.pid && t.classList.contains('margin')) { const ov = { ...(S.prodOv[d.pid] || {}) }; const n = parseFloat(t.value); if (!marginOk(n)) { render(); return; } if (isNaN(n)) delete ov.margin; else ov.margin = n / 100; S.prodOv[d.pid] = ov; saveOv(d.pid, ['margin']); changed(); }
  else if (d.pack != null || d.disc != null) {
    const key = d.pack ?? d.disc, f = d.pack != null ? 'pack' : 'disc', n = parseFloat(t.value);
    const set = { ...(S.packs[key] || {}) };
    if (isNaN(n) || (f === 'pack' ? n < 1 : n < 0 || n >= 100)) delete set[f]; else set[f] = f === 'pack' ? Math.round(n) : n;
    if (Object.keys(set).length) S.packs[key] = set; else delete S.packs[key];
    savePack(key); changed(); openProduct(D.byPid[d.for] ? d.for : (D.offers.find(o => o.key === key)?.pid));
  }
  else if (d.qty != null) { S.quote.lines[+d.qty].qty = Math.max(0, parseFloat(t.value) || 0); saveDraft(); render(); }
  else if (d.uprice != null) { const n = parseFloat(t.value); const l = S.quote.lines[+d.uprice]; l.price = isNaN(n) ? null : n; l.manual = !isNaN(n); saveDraft(); render(); }
});
boot();
</script>
